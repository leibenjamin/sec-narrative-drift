name: Lab Gates

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  lab-gates:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install npm dependencies
        run: npm ci

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install --requirement scripts/requirements.txt

      - name: Run lab predeploy
        run: npm run lab:predeploy

      - name: Run lab portfolio gate
        run: npm run lab:portfolio

      - name: Run production build
        run: npm run build
