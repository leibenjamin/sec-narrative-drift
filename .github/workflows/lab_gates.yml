name: Lab Gates

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  lab-gates:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2f0864fbec33a52ee0ad0c83eab0ee8bd1 # v6.0.2

      - name: Set up Node
        uses: actions/setup-node@6044e13b5dc448c55e2357c09f80417699197238 # v6.2.0
        with:
          node-version: "20"
          cache: npm

      - name: Set up Python
        uses: actions/setup-python@e7975d459f04f0ec0b9876dd63c25fa0f381214a # v6.0.0
        with:
          python-version: "3.11"

      - name: Install npm dependencies
        run: npm ci

      - name: Runtime dependency audit (prod only)
        run: npm audit --omit=dev --audit-level=high

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install --requirement scripts/requirements.txt

      - name: Scan for forbidden HTML injection APIs
        run: |
          PATTERN="dangerouslySetInnerHTML\\s*=|\\binnerHTML\\s*=|insertAdjacentHTML\\s*\\("
          if command -v rg >/dev/null 2>&1; then
            MATCHES="$(rg -n "$PATTERN" src --glob '!**/*.md' || true)"
          else
            MATCHES="$(grep -R -nE "$PATTERN" src || true)"
          fi
          if [ -n "$MATCHES" ]; then
            echo "$MATCHES"
            echo "Forbidden HTML injection API usage found in src/." >&2
            exit 1
          fi

      - name: Run lab predeploy
        run: npm run lab:predeploy

      - name: Run public tone guard
        run: npm run lab:guard-tone

      - name: Run lab readiness gate
        run: npm run lab:readiness

      - name: Run production build
        run: npm run build
