name: Refresh featured datasets

on:
  schedule:
    - cron: "0 3 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
      pull-requests: write
    env:
      SEC_USER_AGENT: ${{ secrets.SEC_USER_AGENT }}
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2f0864fbec33a52ee0ad0c83eab0ee8bd1 # v6.0.2
        with:
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@e7975d459f04f0ec0b9876dd63c25fa0f381214a # v6.0.0
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install --requirement scripts/requirements.txt
      - name: Validate SEC_USER_AGENT
        run: |
          if [ -z "${SEC_USER_AGENT}" ]; then
            echo "SEC_USER_AGENT secret is required." >&2
            exit 1
          fi
      - name: Scan for forbidden HTML injection APIs
        run: |
          PATTERN="dangerouslySetInnerHTML\\s*=|\\binnerHTML\\s*=|insertAdjacentHTML\\s*\\("
          if command -v rg >/dev/null 2>&1; then
            MATCHES="$(rg -n "$PATTERN" src --glob '!**/*.md' || true)"
          else
            MATCHES="$(grep -R -nE "$PATTERN" src || true)"
          fi
          if [ -n "$MATCHES" ]; then
            echo "$MATCHES"
            echo "Forbidden HTML injection API usage found in src/." >&2
            exit 1
          fi
      - name: Run Python tests
        run: |
          pytest scripts/tests/ -v --tb=short
      - name: Build featured datasets
        run: |
          python scripts/sec_fetch_and_build.py --ticker AAPL --years 10 --out public/data/sec_narrative_drift/AAPL
          python scripts/sec_fetch_and_build.py --ticker NVDA --years 10 --out public/data/sec_narrative_drift/NVDA
          python scripts/sec_fetch_and_build.py --ticker TSLA --years 10 --out public/data/sec_narrative_drift/TSLA
      - name: Detect generated changes
        id: changes
        run: |
          if git status --porcelain | grep -q "public/data/sec_narrative_drift/"; then
            echo "has_changes=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_changes=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Create pull request
        if: steps.changes.outputs.has_changes == 'true'
        uses: peter-evans/create-pull-request@c0f553fe49d55a340cafb97aeeff6c99720b77ec # v8.1.0
        with:
          branch: bot/refresh-featured-datasets
          delete-branch: true
          title: "Refresh featured datasets"
          commit-message: "Refresh featured datasets"
          body: |
            Automated weekly refresh of legacy featured datasets.
            This PR was generated by the refresh workflow after tests passed.
          labels: |
            automation
            data-refresh
          add-paths: |
            public/data/sec_narrative_drift/**
